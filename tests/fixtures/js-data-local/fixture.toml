# Built by 11ty 3.1.8 on node:22 and node:24 (cargo xtask fixtures-refresh --docker js-data-local):
# both give the same bytes. Brrrty builds it with config.set_js_data("node").
node = true
input = "src"
tz = "America/Chicago"
lang = "en_US.UTF-8"

[refused]
"src/posts/one.md" = "posts/one/index.html"
"src/posts/two.md" = "posts/two/index.html"
"src/posts/three.md" = "posts/three/index.html"
"src/index.njk" = "index.html"

# The counter file returns different data for each post (11ty: one 1,
# three 2, two 3, by its load order), so its pages are refused by its one
# js-data-impure problem.
[refused_by]
"src/posts/one.md" = "src/posts/posts.11tydata.js"
"src/posts/two.md" = "src/posts/posts.11tydata.js"
"src/posts/three.md" = "src/posts/posts.11tydata.js"

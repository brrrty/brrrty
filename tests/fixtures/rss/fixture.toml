# No `input`: the folders come from brrrty.config.rhai, as 11ty's come from
# eleventy.config.js, which adds four feeds with @11ty/eleventy-plugin-rss
# (installed from site/package-lock.json when the fixture is refreshed).
# 2026-01-01T12:00:00Z. RSS dates print in the local zone, so the zone is
# fixed too, one with daylight saving time.
source_date_epoch = 1767268800
tz = "America/Chicago"

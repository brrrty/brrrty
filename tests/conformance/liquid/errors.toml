[[case]]
name = "err_unknown_filter"
group = "errors"
template = "{{ 'x' | nosuchfilter }}"

[[case]]
name = "err_unknown_filter_in_tag"
group = "errors"
template = "{% if 'x' | nosuchfilter %}a{% endif %}"

[[case]]
name = "err_unknown_filter_second_line"
group = "errors"
template = "line1\nline2 {{ 'x' | nosuchfilter }}"

[[case]]
name = "err_unclosed_if"
group = "errors"
template = "{% if true %}yes"

[[case]]
name = "err_unclosed_for"
group = "errors"
template = "{% for i in (1..2) %}x"

[[case]]
name = "err_unclosed_output"
group = "errors"
template = "{{ x "

[[case]]

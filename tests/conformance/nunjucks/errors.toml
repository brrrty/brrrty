[[case]]
name = "err_unknown_filter"
group = "errors"
template = '''{{ "x" | nopefilter }}'''

[[case]]
name = "err_unknown_filter_line3"
group = "errors"
template = '''
a
b
{{ x | nopefilter }}'''
data = '''{"x": 1}'''

[[case]]
name = "err_unclosed_if"
group = "errors"

[workspace]
resolver = "3"
members = ["crates/*", "xtask", "spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/brrrty/brrrty"
homepage = "https://brrrty.com"

# brrrty-jsregex's tests check every one of the 65,536 UTF-16 units, which
# takes about a minute unoptimized.
[profile.dev.package.brrrty-jsregex]
opt-level = 3

# The collation sweep test sorts a million strings: optimized collation
# keeps it to seconds in a debug build.
[profile.dev.package.icu_collator]
opt-level = 3
[profile.dev.package.icu_normalizer]
opt-level = 3
[profile.dev.package.icu_properties]
opt-level = 3
[profile.dev.package.zerovec]
opt-level = 3
[profile.dev.package.brrrty-js]
opt-level = 3

# Release binaries ship through npm and GitHub Releases: one codegen unit and
# fat LTO for size and speed, symbols stripped. Panics still unwind, so the bug
# report handler keeps working and a crash still exits 101.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

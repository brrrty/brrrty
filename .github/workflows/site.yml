name: Site

# brrrty.com: build Brrrty from this commit, build the site with it, deploy to
# GitHub Pages. Brrrty is built from source here, never installed from npm.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "CHANGELOG.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build Brrrty
        run: cargo build --release --locked -p brrrty
      - name: Build the site
        working-directory: site
        run: ../target/release/brrrty build --strict --output ../_site
      - name: Check the output
        run: |
          test "$(cat _site/CNAME)" = "brrrty.com"
          test -f _site/index.html
          test -f _site/changelog/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

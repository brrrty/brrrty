[package]
name = "brrrty-spike"
version = "0.0.0"
description = "Measures candidate template and Markdown libraries against Eleventy output."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
toml = "1.2.1"
brrrty-core = { path = "../crates/brrrty-core" }
liquid = "=0.26.11"
liquid-core = "=0.26.11"

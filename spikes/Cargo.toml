[package]
name = "brrrty-spike"
version = "0.0.0"
description = "Measures candidate template and Markdown libraries against Eleventy output."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3.27.0"
toml = "1.2.1"
brrrty-core = { path = "../crates/brrrty-core" }
brrrty-js = { path = "../crates/brrrty-js" }
brrrty-liquid = { path = "../crates/brrrty-liquid" }
liquid = "=0.26.11"
liquid-core = "=0.26.11"
minijinja = { version = "=3.0.5", features = ["json", "urlencode", "preserve_order", "serde"] }
brrrty-compat = { path = "../crates/brrrty-compat" }
brrrty-markdown = { path = "../crates/brrrty-markdown" }
comrak = { version = "=0.59.0", default-features = false }
pulldown-cmark = { version = "=0.13.6", default-features = false, features = ["html"] }
markdown-it = { version = "=0.6.1", default-features = false }

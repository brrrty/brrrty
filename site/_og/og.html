<!doctype html>
<!--
  The social card, assets/og.png (1200x630). Not part of the built site.
  Re-render it from site/ after an edit (Chrome, headless, its own temp profile):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --user-data-dir="$(mktemp -d)" --hide-scrollbars --window-size=1200,630 --force-device-scale-factor=1 --virtual-time-budget=2000 --screenshot=assets/og.png "file://$PWD/_og/og.html"
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Brrrty social card</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
/* site.css loads its fonts from /assets/, which file:// can't reach. */
@font-face {
  font-family: "Schibsted Grotesk";
  src: url("../assets/fonts/schibsted-grotesk-latin.woff2") format("woff2");
  font-weight: 400 900;
}
@font-face {
  font-family: "JetBrains Mono";
  src: url("../assets/fonts/jetbrains-mono-latin.woff2") format("woff2");
  font-weight: 400 700;
}

html, body { width: 1200px; height: 630px; overflow: hidden; }
body { min-height: 0; display: block; }

.og-card {
  box-sizing: border-box;
  width: 1200px;
  height: 630px;
  padding: 48px 72px 52px;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
}

.og-top { display: flex; justify-content: space-between; align-items: baseline; }
.og-mark {
  display: inline-flex;
  align-items: center;
  font-weight: 700;
  font-size: 46px;
  letter-spacing: -0.045em;
  line-height: 1;
}
.og-mark::after {
  content: "";
  width: 0.34em;
  height: 0.34em;
  margin-left: 0.04em;
  align-self: flex-end;
  margin-bottom: 0.08em;
  border-radius: 2px;
  background: var(--accent);
}
.og-url { font-family: var(--mono); font-size: 28px; color: var(--fg-2); }

h1 {
  margin-top: 32px;
  font-size: 88px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.045em;
}
.og-sub {
  margin: 24px 0 0;
  font-size: 34px;
  line-height: 1.3;
  color: var(--fg-2);
  letter-spacing: -0.01em;
}

/* The home page's benchmark, compact: bars to scale, 0 to 2.5 s. */
.og-bench {
  --scale: 2.5;
  margin-top: auto;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: last baseline;
  gap: 40px;
}
.og-bench-label { margin: 0 0 16px; line-height: 1.2; font-size: 28px; font-weight: 500; color: var(--fg-2); }
.og-rows { display: grid; gap: 14px; }
.og-row { margin: 0; display: grid; grid-template-columns: 170px 1fr; align-items: center; font-size: 30px; }
.og-who { color: var(--fg-2); }
.og-is-brrrty .og-who { color: var(--fg); font-weight: 600; }
.og-track { display: flex; align-items: center; height: 40px; padding-right: 130px; }
.og-bar {
  height: 100%;
  width: calc(var(--t) / var(--scale) * 100%);
  flex: none;
  border-radius: 3px;
  background: var(--bar-other);
}
.og-is-brrrty .og-bar { background: var(--accent); }
.og-time {
  margin-left: 14px;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 30px;
  color: var(--fg-2);
  white-space: nowrap;
}
.og-is-brrrty .og-time { color: var(--fg); font-weight: 600; }
.og-x {
  margin: 0;
  text-align: right;
  font-size: 30px;
  line-height: 1.2;
  color: var(--fg-2);
}
.og-x b {
  display: block;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 88px;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--accent-text);
}
</style>
</head>
<body>
<div class="og-card">
  <div class="og-top">
    <span class="og-mark">brrrty</span>
    <span class="og-url">brrrty.com</span>
  </div>
  <h1>Eleventy, but<br>make it go brrr.</h1>
  <p class="og-sub">A static site generator in Rust. Byte-compatible with your 11ty&nbsp;site.</p>
  <div class="og-bench">
    <div>
      <p class="og-bench-label">2,272-file blog, clean build</p>
      <div class="og-rows">
        <p class="og-row og-is-brrrty" style="--t: 0.85"><span class="og-who">Brrrty</span><span class="og-track"><span class="og-bar"></span><span class="og-time">0.85 s</span></span></p>
        <p class="og-row" style="--t: 2.32"><span class="og-who">11ty 3.1.8</span><span class="og-track"><span class="og-bar"></span><span class="og-time">2.32 s</span></span></p>
      </div>
    </div>
    <p class="og-x"><b>2.7&times;</b>faster</p>
  </div>
</div>
</body>
</html>

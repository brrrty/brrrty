[package]
name = "brrrty-config"
version = "0.1.20"
description = "Reads brrrty.config.rhai, the Rhai config for Brrrty, an Eleventy-compatible static site generator."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["static-site", "ssg", "eleventy", "11ty", "rhai"]
categories = ["command-line-utilities", "web-programming"]
readme = false
exclude = ["tools/", "tests/regex_probes.rs", "tests/sort_probes.rs", "tests/csv_probes.rs", "tests/markdown_rules.rs", "tests/probes/"]

[dependencies]
brrrty-core = { path = "../brrrty-core", version = "0.1.20" }
brrrty-markdown = { path = "../brrrty-markdown", version = "0.1.20" }
brrrty-liquid = { path = "../brrrty-liquid", version = "0.1.20" }
brrrty-js = { path = "../brrrty-js", version = "0.1.20" }
brrrty-jsregex = { path = "../brrrty-jsregex", version = "0.1.20" }
cap-std = "=4.0.3"
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"] }
indexmap = "2"
regex = "1.13.1"
regex-syntax = "0.8.11"
rhai = { version = "=1.27.0", features = ["sync", "no_closure", "no_time"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11.1"
toml = "1.2.1"
stacker = "0.1.25"
url = "2.5.8"

[dev-dependencies]
brrrty-nunjucks = { path = "../brrrty-nunjucks", version = "0.1.20" }
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

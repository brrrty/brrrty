[package]
name = "brrrty"
version = "0.1.11"
description = "Brrrty, a fast static site generator compatible with Eleventy (11ty) projects."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["static-site", "ssg", "eleventy", "11ty", "site-generator"]
categories = ["command-line-utilities", "web-programming"]
readme = "../../README.md"
exclude = ["tests/fixtures.rs"]

[lib]
name = "brrrty"
path = "src/lib.rs"

[[bin]]
name = "brrrty"
path = "src/main.rs"

[dependencies]
brrrty-compat = { path = "../brrrty-compat", version = "0.1.11" }
brrrty-config = { path = "../brrrty-config", version = "0.1.11" }
brrrty-core = { path = "../brrrty-core", version = "0.1.11" }
brrrty-js = { path = "../brrrty-js", version = "0.1.11" }
brrrty-liquid = { path = "../brrrty-liquid", version = "0.1.11" }
brrrty-markdown = { path = "../brrrty-markdown", version = "0.1.11" }
brrrty-node = { path = "../brrrty-node", version = "0.1.11" }
brrrty-serve = { path = "../brrrty-serve", version = "0.1.11" }
clap = { version = "4.6.7", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
# 8.2.2 is newer than two weeks; stay on 8.2.1.
notify = "=8.2.1"
percent-encoding = "2.3.1"
# `brrrty init`: reads and edits package.json, and shows its changes as a diff.
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
similar = "3.2.1"
# `brrrty doctor --verify` builds into the system temp folder.
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
# `brrrty init` opens package.json and the 11ty config with O_NONBLOCK, so a
# file swapped for a FIFO can't block it.
# `brrrty doctor --verify` stops 11ty's whole process group on Ctrl-C.
libc = "0.2.191"
# Ctrl-C and SIGTERM for `brrrty serve`.
signal-hook = { version = "=0.4.6", default-features = false, features = ["iterator"] }

[dev-dependencies]
# The Chrome test hands Chrome its DevTools pipe (already in the tree through notify).
libc = "0.2.191"
toml = "1.2.1"

# musl's own allocator is slow under threads, and the musl builds are the
# ones npm installs on Linux. glibc and macOS show no difference with
# mimalloc, and keep their own allocators.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "=0.1.43", default-features = false }

[[bench]]
name = "js_call"
harness = false

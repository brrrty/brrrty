[package]
name = "brrrty"
version = "0.0.1"
description = "Eleventy, but make it go brrr."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "brrrty"
path = "src/lib.rs"

[[bin]]
name = "brrrty"
path = "src/main.rs"

[dependencies]
brrrty-core = { path = "../brrrty-core" }
brrrty-markdown = { path = "../brrrty-markdown" }
clap = { version = "4.6.7", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
percent-encoding = "2.3.1"

[dev-dependencies]
tempfile = "3.27.0"
toml = "0.9"
brrrty-compat = { path = "../brrrty-compat" }

[package]
name = "brrrty"
version = "0.0.4"
description = "Brrrty, a fast static site generator compatible with Eleventy (11ty) projects."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["static-site", "ssg", "eleventy", "11ty", "site-generator"]
categories = ["command-line-utilities", "web-programming"]
readme = "../../README.md"
exclude = ["tests/fixtures.rs"]

[lib]
name = "brrrty"
path = "src/lib.rs"

[[bin]]
name = "brrrty"
path = "src/main.rs"

[dependencies]
brrrty-core = { path = "../brrrty-core", version = "0.0.4" }
brrrty-markdown = { path = "../brrrty-markdown", version = "0.0.4" }
clap = { version = "4.6.7", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
percent-encoding = "2.3.1"

[dev-dependencies]
tempfile = "3.27.0"
toml = "1.2.1"
brrrty-compat = { path = "../brrrty-compat", version = "0.0.4" }

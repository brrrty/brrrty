[package]
name = "brrrty-core"
version = "0.0.1"
description = "Core build pipeline for Brrrty, an Eleventy-compatible static site generator."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["static-site", "ssg", "eleventy", "11ty", "site-generator"]
categories = ["command-line-utilities", "web-programming"]
readme = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"] }
brrrty-markdown = { path = "../brrrty-markdown", version = "0.0.1" }
globset = "0.4.19"
ignore = "0.4.34"
rayon = "1.12.0"
regex = "1.13.1"
serde_json = "1"
serde_norway = "0.9"

[dev-dependencies]
tempfile = "3.27.0"

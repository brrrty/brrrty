[package]
name = "brrrty-core"
version = "0.1.0"
description = "Core build pipeline for Brrrty, an Eleventy-compatible static site generator."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["static-site", "ssg", "eleventy", "11ty", "site-generator"]
categories = ["command-line-utilities", "web-programming"]
readme = false
# Calibration scripts for src/order.rs; they need Node, Python and 11ty.
exclude = ["tools/", "tests/luxon.rs", "tests/probes/luxon.json", "tests/rss.rs", "tests/probes/posthtml.json", "tests/nunjucks_filters.rs", "tests/probes/nunjucks_filters.json"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"] }
brrrty-js = { path = "../brrrty-js", version = "0.1.0" }
brrrty-liquid = { path = "../brrrty-liquid", version = "0.1.0" }
brrrty-markdown = { path = "../brrrty-markdown", version = "0.1.0" }
brrrty-prism = { path = "../brrrty-prism", version = "0.1.0" }
brrrty-nunjucks = { path = "../brrrty-nunjucks", version = "0.1.0" }
globset = "0.4.19"
ignore = "0.4.34"
indexmap = "2"
rayon = "1.12.0"
regex = "1.13.1"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
saphyr-parser = "0.3.4"
url = "2.5.8"

# File creation times through statx; see src/birth.rs.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "0.1.26"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"

[package]
name = "brrrty-markdown"
version = "0.0.26"
description = "Markdown rendering for Brrrty, an Eleventy-compatible static site generator."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["static-site", "ssg", "eleventy", "11ty", "site-generator"]
categories = ["command-line-utilities", "web-programming"]
readme = false
exclude = ["tools/", "tests/probes.rs", "tests/fuzz.rs", "tests/probes/"]

[dependencies]
brrrty-jsregex = { path = "../brrrty-jsregex", version = "0.0.26" }
markdown-it = { version = "=0.6.1", default-features = false }
regex = "1.13.1"

[dev-dependencies]
serde_json = "1"

[package]
name = "brrrty-markdown"
version = "0.0.4"
description = "Markdown rendering for Brrrty, an Eleventy-compatible static site generator."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["static-site", "ssg", "eleventy", "11ty", "site-generator"]
categories = ["command-line-utilities", "web-programming"]
readme = false
exclude = ["tools/", "tests/probes.rs", "tests/probes/"]

[dependencies]
markdown-it = { version = "=0.6.1", default-features = false }

[dev-dependencies]
serde_json = "1"

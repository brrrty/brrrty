[package]
name = "brrrty-markdown"
version = "0.0.2"
description = "Markdown rendering for Brrrty, an Eleventy-compatible static site generator."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["static-site", "ssg", "eleventy", "11ty", "site-generator"]
categories = ["command-line-utilities", "web-programming"]
readme = false

[dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }

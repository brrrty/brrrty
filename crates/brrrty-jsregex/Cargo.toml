[package]
name = "brrrty-jsregex"
version = "0.1.6"
description = "JavaScript regular expression syntax and semantics for Brrrty, an Eleventy-compatible static site generator."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["static-site", "ssg", "eleventy", "11ty", "regex"]
categories = ["command-line-utilities", "web-programming"]
readme = false
exclude = ["tools/"]

[dependencies]
fancy-regex = { version = "=0.20.0", default-features = false, features = ["std", "perf", "unicode", "variable-lookbehinds"] }
regex = "1.13.1"
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "perf", "unicode", "hybrid", "nfa-thompson"] }
regex-syntax = "0.8.11"

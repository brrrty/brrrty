[package]
name = "brrrty-nunjucks"
version = "0.1.22"
description = "A Nunjucks template engine that matches Nunjucks 3.2.4 as Eleventy configures it, for an Eleventy-compatible static site generator."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["static-site", "ssg", "eleventy", "11ty", "nunjucks"]
categories = ["template-engine", "web-programming"]
readme = false
exclude = ["tests/conformance.rs", "tests/render.rs", "tests/filters.rs", "tests/probes/conformance_parse_errors.json", "tests/probes/render.json", "tests/probes/filters.json", "tests/symbols.rs", "tests/probes/symbols.json", "tools"]

[dependencies]
brrrty-js = { version = "0.1.22", path = "../brrrty-js" }
brrrty-jsregex = { version = "0.1.22", path = "../brrrty-jsregex" }
indexmap = "2"
stacker = "0.1.25"

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.2.1"

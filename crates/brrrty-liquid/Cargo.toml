[package]
name = "brrrty-liquid"
version = "0.0.2"
description = "A Liquid template engine that matches LiquidJS as Eleventy configures it, for an Eleventy-compatible static site generator."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["static-site", "ssg", "eleventy", "11ty", "liquid"]
categories = ["template-engine", "web-programming"]
readme = false

[dependencies]
stacker = "0.1.25"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.2.1"

[package]
name = "brrrty-liquid"
version = "0.0.29"
description = "A Liquid template engine that matches LiquidJS as Eleventy configures it, for an Eleventy-compatible static site generator."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["static-site", "ssg", "eleventy", "11ty", "liquid"]
categories = ["template-engine", "web-programming"]
readme = false
exclude = ["tests/conformance.rs", "tests/filters.rs", "tests/probes/conformance_parse_errors.json", "tests/probes/filters.json", "tools"]

[dependencies]
brrrty-js = { version = "0.0.29", path = "../brrrty-js" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc", "clock"] }
indexmap = "2"
regex = "1.13.1"
sha2 = "0.11.1"
stacker = "0.1.25"

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"] }
indexmap = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.2.1"
